<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8f5"><meta name="apple-mobile-web-app-capable" content="yes"><title>早晚血压簿</title><link rel="icon" href="./mark.svg"><link rel="apple-touch-icon" href="./icon.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"></head>
<body><header><div class="brand"><img src="./mark.svg" alt="" width="36" height="36">早晚血压簿</div><span>个人健康日志</span></header>
<main><nav aria-label="主导航"><button data-page="entry" aria-pressed="true">记血压</button><button data-page="history">历史记录</button><button data-page="backup">导出与恢复</button></nav>
<section id="entry"><div class="heading"><h1 id="title">记录血压</h1><span id="day"></span></div>
<form id="form"><fieldset><legend>测量时段</legend><div class="segments"><label><input type="radio" name="period" value="早餐">早餐</label><label><input type="radio" name="period" value="晚餐">晚餐</label></div></fieldset>
<div class="measure"><label>收缩压<input name="sbp" type="number" inputmode="numeric" min="1" max="400" required placeholder="—"><small>mmHg</small></label><label>舒张压<input name="dbp" type="number" inputmode="numeric" min="1" max="400" required placeholder="—"><small>mmHg</small></label><label>心率<input name="hr" type="number" inputmode="numeric" min="1" max="350" placeholder="—"><small>次/分 · 选填</small></label></div>
<div class="pair"><label>日期<input type="date" name="date" required></label><label>时间<input type="time" name="time" required></label></div>
<label>服药情况<select name="med"><option>未注明</option><option>服药前</option><option>服药时</option><option>服药后</option><option>当天漏服</option></select></label><label>备注 <small>选填</small><input name="note" maxlength="400" placeholder="例如：跑步后 45 分钟"></label>
<button class="primary" type="submit">保存读数</button><button id="cancel" type="button" hidden>取消编辑</button></form></section>
<section id="history" hidden><div class="heading"><h1>历史记录</h1><span id="count"></span></div><div id="days"></div></section>
<section id="backup" hidden><h1>导出与恢复</h1><h2>导出 CSV</h2><p>日期留空可导出全部记录。</p><div class="pair"><label>开始日期<input id="from" type="date"></label><label>结束日期<input id="to" type="date"></label></div><button class="primary" id="export">导出记录</button><hr><h2>从备份恢复</h2><p>选择本应用导出的 CSV。新记录将合并，已有记录按编号保留。</p><label class="file">选择 CSV 文件<input id="restore" type="file" accept=".csv,text/csv"></label><p class="fine">记录保存在当前设备。换机或清理网站数据前，请先导出备份。</p></section>
<p id="status" role="status" aria-live="polite"></p></main><script src="./app.js" defer></script></body></html>
